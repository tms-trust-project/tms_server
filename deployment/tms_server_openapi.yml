openapi: 3.1.0
info:
  title: Trust Manager System (TMS) Server
  description: |
    The Trust Manager System (TMS) credential server provides for management of credentials requested by application clients.
  version: '0.4.0'
  termsOfService: "https://tapis-project.org"
  contact:
    name: "TMS Server - CICSupport"
    url: "https://tapis-project.org"
    email: "cicsupport@tacc.utexas.edu"
  license:
    name: 3-Clause BSD License
    url: 'https://opensource.org/licenses/BSD-3-Clause'
externalDocs:
  description: Tapis Project
  url: 'https://tapis-project.org'
servers:
  - url: 'http://localhost:3000'
    description: Local test environment
    variables: {}
tags:
  - name: General
    description: General service health and readiness
  - name: Credentials
    description: Manage access credentials
  - name: Institutions
    description: Approved institutions and the identity providers they sign in through

# ------------------------------------------------------------------------------
# --- Paths -------------------------------------------------------------------
# ------------------------------------------------------------------------------
paths:

  # --- sayHello and getVersion ------------------------------------------------
  '/tms/hello':
    get:
      tags:
        - General
      description: Echo a query parameter.
      operationId: sayHello
      parameters:
        - name: name
          schema:
            type: string
          in: query
      responses:
        '200':
          description: Success.
          content:
            text/plain; charset=utf-8:
              schema:
                type: string
  '/tms/version':
    get:
      tags:
        - General
      description: Return server version information.
      operationId: getVersion
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespVersion'
        '500':
          description: Server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpResult'

  # --- createSshKeypair -------------------------------------------------------
  '/tms/pubkeys/creds':
    post:
      tags:
        - Credentials
      description: |
        Create an ssh keypair using provided values for client user, host, host account, number of uses, TTL minutes and key type. All values are required except for key type, which defaults to ED25519. Supported values for key type (case insensitive): ED25519, ECDSA, RSA.

        Setting the number of uses or TTL minutes to a negative value results in maximum limits.
        If both are negative this effectively creates a keypair with no limits.
        If both are specified as 0 then the resulting key is not usable.

        *WARNING* Note that in the current MVP implementation the number of uses and TTL minutes are ignored.
        In a future release of TMS Server, these attributes will be honored.
      operationId: createSShKeypair
      security:
        - TmsClientAuth: []
      requestBody:
        required: true
        description: A JSON object providing information about the SSH keypair to be generated.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReqNewSshKeypair'
      responses:
        '201':
          description: Keypair created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespNewSshKeypair'
        '500':
          description: Server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpResult'

  # --- retrievePubKey --------------------------------------------------------------
  '/tms/pubkeys/creds/retrieve':
    post:
      tags:
        - Credentials
      description: |
        Retrieve public key using provided values for user, host and public key fingerprint. Values may also be provided for user UID and key type, but these are only used for writing to the server side log.

        The user and host must match the host account and host provided when the keypair was generated. If a match is found the public key is returned as part of the result.
      operationId: retrievePubKey
      requestBody:
        required: true
        description: A JSON object providing information about the SSH public key to be retrieved.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReqGetPublicKey'
      responses:
        '200':
          description: Public key found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespGetPublicKey'
        '404':
          description: Public key not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpResult'
        '500':
          description: Server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpResult'

  # --- listInstitutions -------------------------------------------------------
  '/tms/institutions':
    get:
      tags:
        - Institutions
      summary: List approved institutions
      description: |
        Return the approved institutions a user can sign in through. Unapproved entries are never returned.

        Each Globus entry may carry a redirect_idp_domain, which the client passes unchanged as the redirect_idp_domain parameter of the Globus Auth authorize request so that Globus sends the user straight to that institution's IdP. A Globus entry with no domain shows Globus Auth's own organization picker. A tacc_tapis entry signs in through Tapis OAuth2 and never has a domain.

        The list is public and requires no authorization.

        Every 200 response carries an ETag. A client that caches the list can send that value back in If-None-Match and receives 304 with no body when the list has not changed.
      operationId: listInstitutions
      security: []
      parameters:
        - name: If-None-Match
          in: header
          required: false
          description: |
            One or more ETags from previous 200 responses, comma-separated, or * (RFC 9110, section 13.1.2). If any listed tag matches the current list under weak comparison, or the value is *, the server returns 304.
          schema:
            type: string
          example: '"2026-10-28.1"'
      responses:
        '200':
          description: Success.
          headers:
            ETag:
              description: Opaque, quoted strong entity tag for the current list. Changes whenever the list changes.
              required: true
              schema:
                type: string
              example: '"2026-10-28.1"'
            Cache-Control:
              description: Always no-cache. Clients may store the list but must revalidate it with If-None-Match before reuse.
              required: true
              schema:
                type: string
                const: no-cache
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespInstitutions'
              examples:
                mixedProviders:
                  summary: Globus entries with and without a domain, plus a Tapis entry
                  value:
                    result_code: '0'
                    result_msg: Success.
                    data_version: '2026-10-28.1'
                    institutions:
                      - id: utexas
                        name: The University of Texas at Austin
                        provider: globus
                        redirect_idp_domain: utexas.edu
                        idp_logout_url: 'https://enterprise.login.utexas.edu/idp/profile/Logout'
                      - id: globus-other
                        name: Other institution (choose in Globus)
                        provider: globus
                        redirect_idp_domain: null
                        idp_logout_url: null
                      - id: tacc
                        name: Texas Advanced Computing Center
                        provider: tacc_tapis
                        redirect_idp_domain: null
                        idp_logout_url: null
        '304':
          description: Not modified. The If-None-Match value matches the current list; the client should reuse its cached copy. No body is returned.
          headers:
            ETag:
              description: Entity tag for the current list, which matched one the client sent.
              required: true
              schema:
                type: string
            Cache-Control:
              description: Same value as on a 200 response, as RFC 9110 requires for 304.
              required: true
              schema:
                type: string
                const: no-cache
        '500':
          description: Server error, including invalid institution data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpResult'
        '503':
          description: Institution data is temporarily unavailable. The client may retry later.
          headers:
            Retry-After:
              description: Seconds the client should wait before retrying. Sent when the server can estimate when the data will be available again.
              required: false
              schema:
                type: integer
                minimum: 0
              example: 30
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpResult'

# ------------------------------------------------------------------------------
# --- Components ---------------------------------------------------------------
# ------------------------------------------------------------------------------
components:
  securitySchemes:
    TmsClientAuth:
      type: apiKey
      description: |
        Authorization for requests is handled through the use of two headers, X-TMS-CLIENT-ID and X-TMS-CLIENT-SECRET.
      name: X-TMS-CLIENT-ID
      in: header
  schemas:
    # -------------------------------------------------------------------------
    # --- Request objects -----------------------------------------------------
    # -------------------------------------------------------------------------
    ReqNewSshKeypair:
      type: object
      required:
        - tms_identity
        - rp_id
        - rp_account
        - host
        - num_uses
        - ttl_minutes
      properties:
        tms_identity:
          type: string
          description: Username associated with TMS login
        rp_id:
          type: string
          description: Resource provider Id.
        rp_account:
          type: string
          description: Resource provider account.
        host:
          type: string
          description: FQDN for the host where the user has an account.
        num_uses:
          type: integer
          format: int32
          description: Number of allowed uses. *WARNING* Not yet honored.
        ttl_minutes:
          type: integer
          format: int32
          description: TTL in minutes. *WARNING* Not yet honored.
        key_type:
          $ref: '#/components/schemas/SshKeyTypeEnum'
    ReqGetPublicKey:
      type: object
      required:
        - user
        - host
        - public_key_fingerprint
      properties:
        user:
          type: string
          description: Username of the host account.
        user_uid:
          type: string
          description: UID of the host account. Info only. Not used for lookup.
        host:
          type: string
          description: FQDN for the host where the user has an account.
        public_key_fingerprint:
          type: string
          description: Fingerprint of the SSH public key.
        key_type:
          type: string
          description: Type of SSH Key. For example ssh-ed25519 or ssh-rsa. Info only. Not used for lookup.

    # -------------------------------------------------------------------------
    # --- Response objects ----------------------------------------------------
    # -------------------------------------------------------------------------
    RespVersion:
      type: object
      properties:
        result_code:
          type: string
        result_msg:
          type: string
        tms_version:
          type: string
        git_branch:
          type: string
        git_commit:
          type: string
        git_dirty:
          type: string
        source_ts:
          type: string
        rustc_version:
          type: string
    HttpResult:
      type: object
      properties:
        result_code:
          type: string
        result_msg:
          type: string
    RespNewSshKeypair:
      type: object
      properties:
        result_code:
          type: string
        result_msg:
          type: string
        private_key:
          type: string
        public_key:
          type: string
        host_login_user:
          type: string
        public_key_fingerprint:
          type: string
        key_type:
          type: string
        key_bits:
          type: string
        max_uses:
          type: string
        remaining_uses:
          type: string
        expires_at:
          type: string
          format: date-time
    RespGetPublicKey:
      type: object
      properties:
        result_code:
          type: string
        result_msg:
          type: string
        public_key:
          type: string

    RespInstitutions:
      type: object
      required:
        - result_code
        - result_msg
        - data_version
        - institutions
      properties:
        result_code:
          type: string
        result_msg:
          type: string
        data_version:
          type: string
          description: Revision of the institution data. Changes whenever the list changes. Equals the ETag header value without its surrounding quotes.
        institutions:
          type: array
          description: Approved institutions. An empty array means no sign-in options are configured.
          items:
            $ref: '#/components/schemas/Institution'

    # -------------------------------------------------------------------------
    # --- Data objects --------------------------------------------------------
    # -------------------------------------------------------------------------
    Institution:
      type: object
      required:
        - id
        - name
        - provider
        - redirect_idp_domain
        - idp_logout_url
      properties:
        id:
          type: string
          pattern: '^[a-z0-9][a-z0-9-]*$'
          description: Stable identifier of the entry, unique within the list. Lower-case letters, digits and hyphens, starting with a letter or digit.
        name:
          type: string
          minLength: 1
          description: Display name.
        provider:
          $ref: '#/components/schemas/ProviderTypeEnum'
        redirect_idp_domain:
          type: [string, 'null']
          format: hostname
          pattern: '^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$'
          description: |
            Lower-case domain Globus associates with the institution's IdP, passed as the redirect_idp_domain authorize parameter. Always sent; null when there is no IdP to steer to, and always null for tacc_tapis.
        idp_logout_url:
          type: [string, 'null']
          format: uri
          pattern: '^https://'
          description: HTTPS sign-out URL of the institution's own IdP. Always sent; null when there is none.
      if:
        required:
          - provider
        properties:
          provider:
            const: tacc_tapis
      then:
        properties:
          redirect_idp_domain:
            type: 'null'

    # -------------------------------------------------------------------------
    # --- Enums ---------------------------------------------------------------
    # -------------------------------------------------------------------------
    SshKeyTypeEnum:
      type: string
      description: Type of ssh key
      enum:
        - ED25519
        - RSA
        - ECDSA
    ProviderTypeEnum:
      type: string
      description: |
        Login flow for the entry. globus is Globus Auth; tacc_tapis is Tapis OAuth2.
        New values may be added without a major version change. Clients must skip entries whose provider they do not support rather than reject the response.
      x-extensible-enum:
        - globus
        - tacc_tapis
